# Spustenie:  docker compose -f deploy/docker-compose.yml up -d --build
# Appka počúva len na 127.0.0.1 servera; otvára sa cez SSH tunel (pozri SERVER.md).
services:
  social-manager:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: server.env
    volumes:
      - sm-data:/data
    ports:
      - "127.0.0.1:8765:8765"
  # redakcia: každú hodinu jedno kolo (schválenia, preklad nového, opravy, plán nasucho)
  redakcia:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: server.env
    volumes:
      - sm-data:/data
    entrypoint: ["/bin/sh", "-c", "while true; do for p in $${SM_PROJECTS:-1}; do python -m app.redakcia kolo --projekt $$p >> /data/redakcia.log 2>&1; done; sleep 3600; done"]
volumes:
  sm-data:
