<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shorts demo</title>
<style>
:root{--o:#FF6B00;--bg:#000;--t:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#feed{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.s{height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;position:relative}
.s video{height:100%;max-width:100%;aspect-ratio:9/16;object-fit:contain;background:#0a0a0a;border-radius:14px}
.info{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:min(100%,calc(100dvh*9/16));padding:60px 18px 26px;background:linear-gradient(transparent,rgba(0,0,0,.75));pointer-events:none;border-radius:0 0 14px 14px}
.ch{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--o);display:inline-block}
.ti{font-size:14px;opacity:.9;margin-top:6px;line-height:1.35}
.bar{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:min(100%,calc(100dvh*9/16));height:3px;background:rgba(255,255,255,.15)}
.bar i{display:block;height:100%;width:0;background:var(--o)}
.side{position:fixed;right:18px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:14px;z-index:5}
.side button{width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.side button:hover{background:var(--o)}
.side svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#cnt{position:fixed;top:16px;left:18px;font-size:13px;opacity:.7;z-index:5}
#paused{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none}
#start{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:10;text-align:center;padding:16px}
#start h1{font-size:28px}#start h1 b{color:var(--o)}
#start p{opacity:.7;font-size:15px;max-width:340px;line-height:1.4}
#start button{background:var(--o);color:#000;border:0;border-radius:999px;padding:14px 34px;font-size:17px;font-weight:700;cursor:pointer;display:flex;gap:10px;align-items:center}
#start svg{width:22px;height:22px;fill:currentColor}
.err{opacity:.6;font-size:14px}
</style>
</head>
<body>
<div id="start">
  <h1>Shorts <b>demo</b></h1>
  <p id="sub">Načítavam videá…</p>
  <button id="go" disabled><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>Spustiť</button>
  <p style="font-size:13px">Scrolluj alebo šípky hore a dole. Medzerník alebo klik pozastaví.</p>
</div>
<div id="cnt"></div>
<div class="side">
  <button id="up" title="Predchádzajúce"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
  <button id="mute" title="Zvuk"><svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4z"/><path id="wave" d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/></svg></button>
  <button id="mix" title="Zamiešať znova"><svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
  <button id="down" title="Ďalšie"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
</div>
<div id="feed"></div>
<script>
const BAKED = [];
const APP = location.port === "8765" ? "" : "http://localhost:8765";
let list = [], cur = 0, muted = false;
const feed = document.getElementById("feed");
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
async function load(){
  if (APP === "") {
    try {
      const pr = await (await fetch("/api/projects")).json();
      const pm = {}; (pr.projects || pr).forEach(p => pm[p.id] = [p.name, p.color]);
      const vs = await (await fetch("/api/videos")).json();
      const seen = {};
      list = [];
      vs.forEach(v => {
        if (!(v.duration > 0 && v.duration <= 70) || v.project_id < 3) return;
        if (v.removed && !v.preview_path) return;
        const k = v.project_id + "|" + v.title; if (seen[k]) return; seen[k] = 1;
        list.push([v.id, v.title, v.file_path, (pm[v.project_id] || [""])[0], (pm[v.project_id] || ["", ""])[1]]);
      });
    } catch (e) { list = BAKED.slice(); }
  } else list = BAKED.slice();
  document.getElementById("sub").textContent = list.length + " Shorts z kanálov Xplained v náhodnom poradí";
  document.getElementById("go").disabled = !list.length;
  build();
}
function build(){
  shuffle(list); feed.innerHTML = ""; cur = 0;
  list.forEach((v, i) => {
    const s = document.createElement("section"); s.className = "s"; s.dataset.i = i;
    s.innerHTML = `<video playsinline loop preload="none" data-src="${APP}/api/file?path=${encodeURIComponent(v[2])}"></video>
      <div class="info"><div class="ch"><span class="dot" style="background:${esc(v[4]||"#FF6B00")}"></span>${esc(v[3])}</div><div class="ti">${esc(v[1])}</div></div>
      <div class="bar"><i></i></div>`;
    const vid = s.querySelector("video");
    vid.addEventListener("click", () => vid.paused ? vid.play() : vid.pause());
    vid.addEventListener("timeupdate", () => { if (vid.duration) s.querySelector(".bar i").style.width = (vid.currentTime / vid.duration * 100) + "%"; });
    vid.addEventListener("error", () => { s.querySelector(".ti").innerHTML += '<div class="err">Toto video už nie je na Macu.</div>'; });
    feed.appendChild(s);
  });
  feed.scrollTop = 0; activate(0);
}
function prep(i){const s=feed.children[i]; if(!s) return; const v=s.querySelector("video"); if(!v.src){v.src=v.dataset.src; v.preload="auto";}}
function activate(i){
  cur = i;
  [...feed.children].forEach((s, k) => { const v = s.querySelector("video");
    if (k === i) { prep(k); v.muted = muted; v.currentTime = 0; v.play().catch(()=>{}); }
    else { v.pause(); if (Math.abs(k - i) > 2 && v.src) { v.removeAttribute("src"); v.load(); } } });
  prep(i + 1);
  document.getElementById("cnt").textContent = (i + 1) + " / " + list.length;
}
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting && e.intersectionRatio > .6) { const i = +e.target.dataset.i; if (i !== cur) activate(i); } }), {threshold: [.6]});
new MutationObserver(() => [...feed.children].forEach(s => io.observe(s))).observe(feed, {childList: true});
function go(d){const i=Math.max(0,Math.min(list.length-1,cur+d)); feed.children[i]?.scrollIntoView({behavior:"smooth"});}
document.getElementById("up").onclick = () => go(-1);
document.getElementById("down").onclick = () => go(1);
document.getElementById("mix").onclick = () => build();
document.getElementById("mute").onclick = () => { muted = !muted; const v = feed.children[cur]?.querySelector("video"); if (v) v.muted = muted; document.getElementById("wave").style.display = muted ? "none" : ""; };
document.getElementById("go").onclick = () => { document.getElementById("start").style.display = "none"; activate(cur); };
addEventListener("keydown", e => {
  if (e.key === "ArrowDown" || e.key === "PageDown") { e.preventDefault(); go(1); }
  else if (e.key === "ArrowUp" || e.key === "PageUp") { e.preventDefault(); go(-1); }
  else if (e.key === " ") { e.preventDefault(); const v = feed.children[cur]?.querySelector("video"); if (v) v.paused ? v.play() : v.pause(); }
});
load();
</script>
</body>
</html>
